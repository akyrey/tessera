[package]
name = "tessera"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
governor = "0.10.4"
humantime = "2.4.0"
mime_guess = "2.0.5"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
webauthn-rs = { version = "0.6.2", features = ["conditional-ui"] }
webauthn-rs-proto = "0.6.2"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
